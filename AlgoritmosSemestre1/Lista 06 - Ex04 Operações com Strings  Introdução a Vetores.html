<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Escreva uma palavra: <input id="ipt_p1">
    <br> Escreva outra palavra: <input id="ipt_p2">
    <br> <button onclick="analisar()">Analisar Palavras</button>
    <div id="exiba"></div>

</body>
<script>
    function analisar(){
        let p1 = ipt_p1.value;
        let p2 = ipt_p2.value;
        let p1m = ipt_p1.value.toLowerCase()
        let p2m = ipt_p2.value.toLowerCase()
        let p1n = ipt_p1.value.toUpperCase()
        let p2n = ipt_p2.value.toUpperCase()


        if(p1 === p2){
            exiba.innerHTML = `As palavras ${p1} e ${p2} são exatamente iguais!`
        } else if (p1n === p2n && p2m === p1m){
            exiba.innerHTML = `As palavras ${p1} e ${p2} possuem o mesmo conteúdo, 
            mas a digitação é diferente (maiúsculas e minúsculas)`
        }else {
            exiba.innerHTML = `As palavras ${p1} e ${p2} são completamente diferentes`

        }
    }
</script>
</html>
