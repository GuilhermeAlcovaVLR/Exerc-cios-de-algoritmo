<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Escreva uma frase:
        <br> <input id="ipt_frase">
        <button onclick="analisar()">Analisar frase</button>
        <div id="exibir_num"></div>
</body>
<script>
    function analisar(){
        let frase = ipt_frase.value;
        let str = frase.length;

        exibir_num.innerHTML = `Tamanho da frase: ${str}`
        if (str < 10){
            exibir_num.innerHTML += `<p style = "color: red;">Frase curta!</p>`
        }else{
            exibir_num.innerHTML += `<p style = "color: blue;">Frase longa!</p>`
        }
    }
</script>
</html>
