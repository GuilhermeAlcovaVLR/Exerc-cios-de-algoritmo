<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Escreva uma frase
    <input type='text' id="ipt_frase" >
    <br>
    Qual a poisição da letra que você quer?
    <input type="number" id="ipt_num" onkeyup="analise()">

    <div id="exibir"></div>

</body>
<script>
    function analise() {
        let frase = ipt_frase.value;
        let numero = ipt_num.value - 1;
        let inicio = frase [0];
        let fim = frase[frase.length -1];
        let escolha = frase [numero];

        exibir.innerHTML = `A primeira letra é:   ${inicio}, <br>
        A ${numero + 1}ª letra é: ${escolha}, <br>
        A última letra é: ${fim}`

    }
</script>

</html>
