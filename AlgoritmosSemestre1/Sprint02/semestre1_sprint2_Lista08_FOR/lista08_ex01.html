<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantas pessoas vão entrar no carro? <br><input type="number" id="ipt_pessoas"></input>
     
    <button onclick="carona()">PARTIU CARONA</button><br>

    <div id="div_exibir"></div>
    
</body>

<script>
    function carona(){
    let pessoas = Number(ipt_pessoas.value)
    let texto = ``
    if(pessoas % 1 != 0 || pessoas < 0){
        alert(`Uepaaaaaaaa`)
    }else{
    for(let contador = 1; contador <= pessoas; contador++){
        if(contador <= 5){
            if(contador == 1){
            texto += `Entrou o ${contador}º passageiro (que é o(a) motorista))<br>`

            }else{
            texto += `Entrou o ${contador}º passageiro<br>`
            }
        }else{
            texto += `O ${contador}º passageiro terá que esperar!<br>`
        }
    }
    div_exibir.innerHTML = `${texto}`
    }
}

</script>
</html>
