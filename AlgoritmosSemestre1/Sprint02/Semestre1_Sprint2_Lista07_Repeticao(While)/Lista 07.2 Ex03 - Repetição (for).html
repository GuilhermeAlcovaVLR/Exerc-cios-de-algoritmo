<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="diga()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_exibir"></div>

</body>
<script>
    function diga(){
        let frase = `Uuiiiaaaaaaaaaaaaa`;
        let numeracao = Number(0)
        let cr = ``
        for(let uia = Number(0); uia < 7;uia++){
            numeracao++
            cr += `${numeracao} - ${frase}<br>`
        } 
        div_exibir.innerHTML += `${cr}`
    }
 
</script>
</html>
