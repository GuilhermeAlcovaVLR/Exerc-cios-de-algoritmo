<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="par()">S2 Pares</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function par(){
        let dois = 2 
        let multiplicador = 0
        let texto = ``
        while(multiplicador < 50){
            multiplicador++
            texto += `<br>${dois * multiplicador}`
        }
        div_exibir.innerHTML = `${texto}<br>`
    }
</script>
