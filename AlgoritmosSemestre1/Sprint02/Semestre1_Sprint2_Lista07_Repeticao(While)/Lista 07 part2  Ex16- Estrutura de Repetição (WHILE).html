<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantos dias você faz musculação?
    <input type="number" id="ipt_dia"><br>
    <button onclick="rotina()">Exibir rotina mensal</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function rotina(){
        let dias = Number(ipt_dia.value);
        let diario = Number(0)
        let mes = Number(30);
        let texto = ``
        while(diario <= 30){
            diario++
            if((diario - 1) % dias  == 0){
                texto += `<br>Musculação`
            }else {
                texto += `<br>Comer, dormir etc`
            }
        }
        div_exibir.innerHTML = `${texto}`
    }
</script>
