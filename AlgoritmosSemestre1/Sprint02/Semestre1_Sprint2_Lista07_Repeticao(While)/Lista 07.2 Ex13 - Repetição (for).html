<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Um número: <input type="number" id="ipt_num"><br>
    Uma frase: <input type="text" id="ipt_frase"><br>
    <button onclick="papagaio()">papagaio</button>
    <div id="div_exibir"></div>
</body>

</html>
<script>
    function papagaio() {
        let numero = Number(ipt_num.value);
        let frase = ipt_frase.value
        let veses = ``
        let acumulo = ``
        for (let contador = 1; contador <= numero; contador++) {

            acumulo += `${frase} `

            veses += `<br>${contador} - ${acumulo} `

        }
        div_exibir.innerHTML = `${veses}`


    }
</script>
