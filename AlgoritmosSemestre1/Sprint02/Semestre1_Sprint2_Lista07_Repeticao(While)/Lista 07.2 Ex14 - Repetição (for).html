<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Inicio<input type="number" id="ipt_inicio"><br>
    Fim<input type="number" id="ipt_fim"><br>
    <select id="opt_divisao">
        <option disabled selected>Tabuada</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
    </select>
    <button onclick="divisivel()">Divisível</button>
    <div id="div_exibir"></div>
</body>

</html>
<script>
    function divisivel() {
        let inicio = Number(ipt_inicio.value)
        let fim = Number(ipt_fim.value)
        let divisao = Number(opt_divisao.value)

        let texto = ``
        for ( inicio; inicio <= fim; inicio++)
         {
            if (inicio % divisao != 0) {
                texto += `<br>${inicio}`
            }else{
                texto += ""
            }

        }
        div_exibir.innerHTML = `${texto}`

    }
</script>
