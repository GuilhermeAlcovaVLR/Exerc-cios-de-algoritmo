<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <select id="opt_tabuada">
        <option disabled selected>Tabuada</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
    </select>
    <br> Até que número a tabuada deve ser construída?
    <input type="number" id="ipt_tab">
    <button onclick="ver()">Ver tabuada</button>
    <div id="div_exibir"></div>
</body>

</html>
<script>
    function ver() {
        let tabuada = Number(opt_tabuada.value);
        let multiplicador = Number(ipt_tab.value);
        let conta = Number(``)
        let texto = ``;
        for (let numero = Number(1);
        numero <= multiplicador;numero++) {
            conta = tabuada * numero

            if (conta % 2 == 0) {
                texto += `<br><p style ='color:blue'>
                ${tabuada} X ${numero} = ${conta}</p>`

            } else if (conta % 2 != 0) {
                texto += `<br><p style ='color:red'>
                ${tabuada} X ${numero} = ${conta}</p>`

            }
        }

        div_exibir.innerHTML = ` ${texto}`


    }


</script>
