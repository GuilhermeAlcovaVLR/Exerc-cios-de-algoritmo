<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_aluno">
    <button onclick="cadastro()">CADASTRO</button>
    <div id="div_exibir"></div>
</body>
<script>
    let listaAlunos = [];

    function cadastro(){
        let aluno = ipt_aluno.value;
        listaAlunos.push(aluno);
        let mensagem = ``;
        for(let i = listaAlunos.length -1; i >= 0; i--){
            mensagem += `${listaAlunos[i]}<br>`
        }
        div_exibir.innerHTML = `${mensagem}<br>`

    }


</script>
</html>
