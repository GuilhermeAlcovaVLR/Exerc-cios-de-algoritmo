<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_filme"><br>
    <button onclick="cadastro()">CADASTRAR</button>
    <div id="div_exibir"></div>
</body>

<script>
    let listaFilmes = [];

    function cadastro(){
        filme = ipt_filme.value;
        listaFilmes.push(filme);
        let exibir = ``;

        for(let i = 0; i < listaFilmes.length; i++){
            if(i == 0 || i % 2 == 0){
             exibir += `<p style = "color: blue">${listaFilmes[i]}</p><br>`
            }else{
             exibir += `<p style = "color: red">${listaFilmes[i]}</p><br>`
               
            }
            
        }
        div_exibir.innerHTML = `${exibir}`
    }
</script>
</html>
