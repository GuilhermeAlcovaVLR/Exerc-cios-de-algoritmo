<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Insira seus filmes favoritos 1 por vez: <input type="text" id="ipt_filmes">
    <button onclick="cadastrar()">Cadastrar filme</button> <br>
    <div id="div_exibir"></div>
</body>
<script>
    let lista = [];
    function cadastrar(){
        let filme = ipt_filmes.value;
        lista.push(filme);
        if(lista.length > 2){
        div_exibir.innerHTML = ` Seu filme favorito: ${lista[0]}<br>

Seu 3º filme favorito: ${lista[2]} <br>

Total de filmes cadastrados: ${lista.length} `
}else{
    div_exibir.innerHTML = ` Seu filme favorito: ${lista[0]}<br>

Seu 3º filme favorito: Ainda não existe <br>

Total de filmes cadastrados: ${lista.length} `

}
    }
</script>
</html>
