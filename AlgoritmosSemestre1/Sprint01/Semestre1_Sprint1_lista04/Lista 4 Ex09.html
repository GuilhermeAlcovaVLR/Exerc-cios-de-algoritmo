<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Crie um programa que controle o peso médio dentro de um elevador:  

Quantidade de homens <input type="number" id="qt_h"> <br>
Quantidade de mulheres <input type="number" id="qt_m"> <br>
<button onclick="peso()">Analisar peso</button>
<div id="exibir_peso"></div>

</body>
<script>
    function peso() {
        let homens = Number(qt_h.value);
        let mulheres = Number(qt_m.value);
        let ph = homens * 80;
        let pm = mulheres * 60;
        let total = ph + pm
        exibir_peso.innerHTML = `Este elevador suporta 800 Kg
        <br> e o peso estimado desta lotação é de ${total}kg`

        if (total > 800){
            exibir_peso.innerHTML += `<p style = ' color: blue'>Será necessário que alguém desça
             para que o elevador se movimente</p>`
        }

    }
</script>
</html>
