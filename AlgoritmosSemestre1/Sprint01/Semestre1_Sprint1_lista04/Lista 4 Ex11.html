<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Qual o seu nome? <input type="text" id="nom"> <br>
    Qual a sua idade? <input type="number" id="idd"> <br>
    <button onclick="cnh()">Avaliar aluno</button>
    <div id="exibir_"></div>
    
</body>
<script>
    function cnh() {
        let idade = Number(idd.value);

        if (idade >= 18)
        exibir_.innerHTML = `${nom.value}, vamos tirar a CNH?`

        if (idade < 18)
         exibir_.innerHTML = `${nom.value}, vai jogar PlayStation!`

    }
</script>
</html>
