<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nome do Bairro: <input type="text" id="ipt_bairro">
    <button onclick="cadastro()">Cadastrar bairro</button> <br>
    Local em que quer lembrar: <input type="number" id="ipt_num">
    <button onclick="relembra()">Relembrar moradia</button> <br>
    <div id="div_exibir"></div>

</body>
<script>
    let lista = [];
    function cadastro(){
        let bairro = ipt_bairro.value;
        lista.push(bairro);
        div_exibir.innerHTML = `${bairro} adiconado com sucesso`
        ipt_bairro.value = ``
    }
    function relembra(){
        let numero = Number(ipt_num.value);

        if (numero <= lista.length && numero > 0){
            div_exibir.innerHTML = `${numero}º é ${lista[numero - 1]}`
        }else{
            div_exibir.innerHTML = `Você ainda não morou num ${numero}º bairro!`
        }
    }
</script>
</html>
