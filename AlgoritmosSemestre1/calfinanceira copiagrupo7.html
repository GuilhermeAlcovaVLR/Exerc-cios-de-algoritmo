<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira</title>
    <link rel="stylesheet" href="CalculadoraFinal.css">
    <link rel="icon" href="calculadora-icon.png" type="image/x-icon">
</head>

<body>

    <div class="container">
        <div class="conteudo">
            <H1>Calculadora Financeira</H1>
            <H3>Calcule a sua perda</H3>
            <p>Entrada total de clientes</p><input type="text" id="ipt_entrada" class="input"> <br>
            <span class="span-green">41,3%</span>
            <p class="p-style">Índice estimado de consumidores propensos a desistir da compra ao enfrentar filas longas
            </p><br>
            <span class="span-green">R$35,80</span>
            <p class="p-style">Gasto diário estimado por pessoa no mercado</p>
            <button onclick="calcular()" class="button">Calcular</button><br>
            <div id="div_exibir" class="conteudo-div_exibir"></div>
        </div>
    </div>

</body>

</html>

<script>
    function calcular() {

        let ValorMensal = 1073.98; 

        let PercentualDesistencia = 0.413; 

        let cliente = Number(ipt_entrada.value);

        let TotalEstimadoMes = cliente * ValorMensal;

        let Desistencia = cliente * PercentualDesistencia; 

        let PrejuizoMes = Desistencia * ValorMensal; 

        div_exibir.innerHTML = `<h3>Resultado da Simulação</h3> 
        <p>👥 Clientes analisados: ${ipt_entrada.value}<BR> 
        📅 Valor movimentado por mês: <span class="span-black"> R$ ${TotalEstimadoMes.toFixed(2)}</span><br> 
        📉 Potencial não movimentado por mês: <span class="span-black"> R$ ${PrejuizoMes.toFixed(2)}</span><br></p> 
    <span class="span-black">Potencial de vendas:</span> ao reduzir as desistências, o supermercado pode recuperar parte desse valor. 
    <p class="observacao"> 
        Os valores são estimativas e não representam 
        lucro ou perda financeira comprovada. 
    </p> `
    }

</script>
