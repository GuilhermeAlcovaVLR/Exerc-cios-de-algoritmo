<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Sua renda: <input type="number" id="ipt_renda">
    <br>Renda familiar: <input type="number" id="ipt_faml">
    <button onclick="renda()">Verificar ajuda</button>
</body>
<script>
    function renda(){
        let renda = Number(ipt_renda.value);
        let fam = Number(ipt_faml.value);
        if(renda <= 1500 && fam <= 2100){
            alert(`Você terá direito!`)
        } else {
            alert(`Você NÃO terá direito`)
        }
    }
</script>
</html>
