<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Qual o valor da pizza? <input type="number" id="piz_vlr"> <br>
    Quantos amigos irão fortalecer? <input type="number" id="amg"> <br>
    <button onclick="rlpizza()">ROLA PIZZA?</button>
    <div id="exibir_racha">
    
</body>
<script>
    function rlpizza(){
        let pizza = Number(piz_vlr.value)
        let amigos = Number(amg.value)
        let racha = pizza / amigos
        exibir_racha.innerHTML = `Cada amigo vai pagar R$${racha} pela pizza`

        if (racha > 20){
            exibir_racha.innerHTML += `<br>Deu ruim! Pizza muito cara`
        }
    }

</script>
</html>
