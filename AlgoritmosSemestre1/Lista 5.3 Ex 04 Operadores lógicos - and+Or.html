<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Idade <input type="number" id="ipt_idd">
    <br> <select id="opt_vip">
        <option disabled selected>INGRESSO VIP?</option>
        <option value="sim">SIM</option>
        <option value="nao">NÃO</option>
    </select>

    <br>
    <select id="opt_especial">
        <option disabled selected>CONVITE ESPECIAL</option>
        <option value="sim">SIM</option>
        <option value="nao">NÃO</option>
    </select>
    <button onclick="acesso()">Liberar acesso</button>
</body>
<script>
    function acesso(){
        let idade = Number(ipt_idd.value);
        let vips = opt_vip.value;
        let espe = opt_especial.value;
        if ((idade >= 18) && (vips == "sim" || espe == "sim")){
            alert(`Liberar acesso`)
        }else{
            alert(`Acesso negado`)
        }
    }
</script>
</html>
