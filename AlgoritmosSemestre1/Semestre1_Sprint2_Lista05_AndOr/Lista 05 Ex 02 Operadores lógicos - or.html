<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nota Enem <input type="number" id="nt_enem">
    <br>Nota Vestibular <input type="number" id="nt_vst">
    <button onclick="avaliacao ()">Avaliação</button>
    
</body>
<script>
    function avaliacao(){
        let enem = Number(nt_enem.value);
        let vest = Number(nt_vst.value);
        if(enem > 800 || vest >= 700){
            alert(` Parabéns! Aprovado`)
        }else{
            alert(`Tente semestra que vem`)
        }

    }
</script>
</html>
