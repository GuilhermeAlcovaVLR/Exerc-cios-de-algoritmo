<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Insira nota: <input type="number" id="ipt_n">
    <br><button onclick="avaliar()">Avaliar aluno</button>
</body>
<script>
    function avaliar(){
        let n1 = Number(ipt_n.value);
        if (n1 >= 0 && n1 <= 10){
                alert("Nota válida!")
        } else {
            alert("Onde já se viu nota menor que 0 e maior que 10?!")
        }
    }
</script>
</html>
