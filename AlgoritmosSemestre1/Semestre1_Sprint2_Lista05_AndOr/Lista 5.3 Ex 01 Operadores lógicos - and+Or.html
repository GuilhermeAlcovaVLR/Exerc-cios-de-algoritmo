<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nota do vestibular <input type="number" id="ipt_nt">
    <br>Nota do ENEM <input type="number" id="ipt_enem">
    <br> Nota da redação <input type="number" id="ipt_red">
    <button onclick="apravacao()">Verificar aprovação</button>
</body>
<script>
    function apravacao(){
        let vestibular = Number(ipt_nt.value);
        let enem = Number(ipt_enem.value);
        let redacao = Number(ipt_red.value);
        
        if ((vestibular >= 700 || enem >= 650) && redacao > 0 ){
            alert(`Aprovado!`)
        }else{
            alert(`Não aprovado!`)
        }
    }
</script>
</html>
