    function desconto(){
        let itens = Number(ipt_itens.value);
        let total = Number(ipt_vlr.value);
        let fidelidade = opt_fid.value;
        let cupom = ipt_cum.value;
        if((itens >= 3) && (fidelidade == "SIM" || cupom == "PROMO10")){
            alert(`Desconto aplicado`)
        }else {
            alert(`Compra não elegível para desconto`)
        }
    }
