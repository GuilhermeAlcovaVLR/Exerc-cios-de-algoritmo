<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Nome do projeto<input type="text" id="ipt_projeto"><br>
    <button onclick="registrar()">Registrar</button>
    <button onclick="mostrar()">Mostrar Projetos</button>
    <div id="div_exibir"></div>
</body>
<script>
    let listaProjeto = [];

    function registrar() {
        let projeto = ipt_projeto.value;
        listaProjeto.push(projeto);
        let experiencia = ``;
        if (listaProjeto.length < 5) {
            experiencia = `Júnior`
        } else if (listaProjeto.length < 13) {
            experiencia = `Pleno`
        } else {
            experiencia = `Senior`
        }
        div_exibir.innerHTML = `Você já fez ${listaProjeto.length} projetos. Por isso você é um profissional ${experiencia}  `


    }
    function mostrar() {

            let mensagem = ``;
            for (let i = listaProjeto.length - 1; i >= 0; i--) {
                mensagem += `${listaProjeto[i]}<br>`
            }

            div_exibir.innerHTML = `${mensagem}<br>`
        }




</script>

</html>
