<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantas voltas o carro dará?
    <input type="number" id="ipt_voltas"><br>
    <button onclick="corrida()">Iniciar corrida</button>
    <div id="div_volta"></div>
</body>
<script>
    function corrida(){
        let voltas = Number(ipt_voltas.value);
        let contagem = Number(0);
        let frase = ``
        while(voltas > contagem){
            contagem++
            frase += `<br>Carro dando a ${contagem}ª volta`
        }
        div_volta.innerHTML = `${frase}
        <br> Corrida finalizada`
    }
</script>
</html>
