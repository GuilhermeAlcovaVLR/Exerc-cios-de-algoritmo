<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantidade de elefantes <input type="number" id="qtd_elefantes"><br>
    <button onclick="atazanar()">Atazanar a médium</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function atazanar(){
        let elefantes = Number(qtd_elefantes.value)
        let contador = Number(0)
        let incomada = `incomodam, `
        let acumulo = ``
        let texto = ``
        while(contador < elefantes){
            contador++
            acumulo += `${incomada}`
            texto += `<br>${contador} elefantes ${acumulo} muito mais`

        }

        div_exibir.innerHTML += `${texto}`

    }
</script>
