<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <br>Umidade atual <input type="number" id="um">
    <button onclick="verificar()">Verificar Umidade</button>
    <div id="exibir"></div>

</body>
<script>
    function verificar(){
        let umi = Number(um.value);
        if (umi < 0 || umi > 100){
            exibir.innerHTML = `Insira um valor válido`
        } else if (umi < 12){
            exibir.innerHTML = `Estado de Emergencia`
        } else if (umi <= 20){
            exibir.innerHTML = `Estado de alerta`
        } else if (umi <= 30){
            exibir.innerHTML = `Estado de atenção`
        } else {
            exibir.innerHTML = `Nenhum risco`
        }
    }
</script>
</html>
