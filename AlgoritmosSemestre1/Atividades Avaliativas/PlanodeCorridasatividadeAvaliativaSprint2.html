<body>

    Insira a meta de distância semanal (em km)<input type="number" id="ipt_meta"><br>
    Insira o número máximo de semanas do plano<input type="number" id="ipt_semanas"><br>

<script>

        let meta = Number(ipt_meta.value);
        let semanas = Number(ipt_semanas.value);

        let contador = Number(0);
        let texto = ``
        let novo = Number(``)
        let acumulo = Number(``)

        let contagem_leve = Number(0)
        let contagem_moderado = Number(0)
        let contagem_intenso = Number(0)
        let contagem_descanso = Number(0)

        let treino_recuperacao = Number(``);
        let percentual_meta = Number(``)



        //if (inicial <= 0 || aumento > 10 || aumento < 1 || meta < inicial || semanas < 1 || semanas > 24) {
        //  alert(`A distância inicial não pode ser menor ou igual a 0;

        //} else {
        while (inicial < meta && contador < semanas) {
            contador++

            if (contador % 4 == 0) {
                contagem_descanso++
                inicial -= novo

                treino_recuperacao = inicial * (70/100);
                percentual_meta = (treino_recuperacao / meta) * 100
                texto += `<br>SEMANA ${contador} - TREINO DE RECUPERAÇÃO - ${treino_recuperacao.toFixed(2)} km (${percentual_meta.toFixed(2)}% da meta)`

            } else if (percentual_meta < 50) {
                contagem_leve++

                texto += `<br>SEMANA ${contador} - TREINO LEVE - ${inicial.toFixed(2)} km (${percentual_meta.toFixed(2)}% da meta)`
            } else if (percentual_meta < 80) {
                contagem_moderado++

                texto += `<br>SEMANA ${contador} - TREINO MODERADO - ${inicial.toFixed(2)} km (${percentual_meta.toFixed(2)}% da meta)`
            } else {
                contagem_intenso++

                texto += `<br>SEMANA ${contador} - TREINO INTENSO - ${inicial.toFixed(2)} km (${percentual_meta.toFixed(2)}% da meta)`
            }
            novo = inicial * aumento

        }

        let percentual_intenso = ( contagem_intenso/contador) * 100;
        div_exibir.innerHTML = `${texto}<br>

`
