<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nota <input type="number" id="ipt_nota"><br>

    <button onclick=" registro()">REGISTAR</button><br><br>

    <input type="number" id="ipt_seq"> <button onclick="listar()">LISTAR</button><br>
    
    <div id="div_exibir"></div>

    <button onclick="encerrar()">ENCERRAR</button>
</body>
<script>
    let listaNotas = [];
    let acima = [];
    let mediana = [];
    let abaixo = [];

    let total = Number(0)

    function registro(){
        let nota = Number(ipt_nota.value);

        if(nota < 1 || nota > 10){
            alert(`A nota é entre 1 e 10`)
        }else{
            listaNotas.push(nota)
            total += nota

            if(nota > 8){
                acima.push(nota)
            }else if(nota >= 6){
                mediana.push(nota)
            }else{
                abaixo.push(nota)
            }
        }
    }

    function listar(){
        let sequencia = Number(ipt_seq.value);
        let realSequencia = sequencia - 1
        let texto = ``;

        if(realSequencia > listaNotas.length){
            alert(`ainda não temos essa nota`)
        }else{
            for(let i = realSequencia; i < listaNotas.length; i++){
                let status = ``

                if(listaNotas[i] > 8){
                    status = `maior que 8`
                }else if(listaNotas[i] >= 6){
                    status = `entre 6 e 8`
                }else{
                    status = `menor que 6`
                }

                texto += `${i + 1}ª nota é ${listaNotas[i]} sendo que essa nota é ${status}<br>`
            }
            div_exibir.innerHTML = `${texto}`

        }
    }

    function encerrar(){
        let maior = listaNotas[0];

        for(let a = 0; a < listaNotas.length; a++){
            if(listaNotas[a] > maior){
                maior = listaNotas[a];
            }
            
        }

        div_exibir.innerHTML = `
        Total de notas registradas = ${listaNotas.length}<br><br>

Total de notas maior que 8 = ${acima.length}<br><br>

Total de notas entre 6 e 9 = ${mediana.length}<br><br>

Total de notas menor que 6 = ${abaixo.length}<br><br>

Média das notas registradas = ${(total/ listaNotas.length).toFixed(2)}<br><br>

Maior nota registrada = ${maior}`


    }
</script>
</html>
