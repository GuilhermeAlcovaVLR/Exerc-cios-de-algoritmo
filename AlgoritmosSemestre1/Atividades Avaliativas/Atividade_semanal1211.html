<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Categoria<select id="slt_categoria">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select><br>
    Serviço<input type="text" id="ipt_svr"><br>
    Valor<input type="number" id="ipt_vlr"><br>

    <button onclick="cadastro()">Cadastrar serviço e valor</button>

    <div id="div_exibir"></div><br><br>

    <input type="number" id="ipt_ajuste">
    Categoria<select id="slt_Acategoria">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select><br>
    <button onclick="ajuste()">AJUSTAR</button>
    <div id="div_ajuste"></div><br><br>

    <button onclick="encerrar()">ENCERRAR</button>
    <div id="div_encerrar"></div>


</body>
<script>
    let listaServico = [];
    let listaPreco = [];
    let valorTotal = Number(0)

    let listaCategoria = []


    function cadastro() {
        let servico = ipt_svr.value;
        let preco = Number(ipt_vlr.value)
        let categoria = slt_categoria.value


        if (servico.length < 5) {
            alert(`Não pode haver serviço com menos de 5 dígitos`)

        } else if (listaServico.indexOf(servico) != -1) {
            alert(`Não pode haver serviço duplicado`)

        } else if (preco < 1 || preco >= 40) {
            alert(`O preço tem que estar entre 1 e 39,99`)
        } else {
            listaServico.push(servico);
            listaPreco.push(preco);
            listaCategoria.push(categoria);
            valorTotal += preco


            let texto = ``

            for (let i = listaServico.length - 1; i >= 0; i--) {
                texto += `${listaCategoria[i]}<br>${listaServico[i]}<br>${listaPreco[i]}<br><br>`

            }
            div_exibir.innerHTML = `${texto}`
        }
    }


    function ajuste() {
        let ajuste = Number(ipt_ajuste.value);
        let categoria = slt_Acategoria.value;

        let mudanca = ajuste / 100


        if (ajuste < 1 || ajuste > 20) {
            alert(`O percentual deve estar entre 1 e 20%`)
        }
        else {

            for (let b = 0; b < listaCategoria.length; b++) {
                if (listaCategoria[b] === categoria) {
                    listaPreco[b] += (listaPreco[b] * mudanca)
                }
            }

            let texto = ``;

            for (let i = 0; i < listaPreco.length; i++) {
                if (listaCategoria[i] === categoria) {
                texto += `Serviço: ${listaServico[i]}<br>
                Valor: ${listaPreco[i]}<br><br><br>`
                }
            }
            div_ajuste.innerHTML = `${texto}`
        }
    }



    function encerrar() {
        let maior = listaPreco[0];
        let menor = listaPreco[0];

        let idMaior = 0;
        let idMenor = 0;

        let texto = ``
        for (let i = 0; i < listaPreco.length; i++) {
            if (listaPreco[i] > maior) {
                maior = listaPreco[i];
                idMaior = i
            }
            if (listaPreco[i] < menor) {
                menor = listaPreco[i]
                idMenor = i
            }
        }


        div_encerrar.innerHTML = `Quantidade de serviços cadastrados: ${listaServico.length}<br><br>
    ${listaServico[idMaior]}, ${listaCategoria[idMaior]}  Maior: ${maior}<br><br>
    ${listaServico[idMenor]}, ${listaCategoria[idMenor]} Menor: ${menor}<br><br>
     Média do valor dos serviços: ${((valorTotal / listaPreco.length)).toFixed(2)}<br>`




    }

</script>

</html>
