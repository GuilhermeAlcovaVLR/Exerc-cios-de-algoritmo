<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Tamanho do celular <input type="number" id="ipt_tmn">
    <br>
    <select id="cores">
        <option value="preto">Preto</option>
        <option value="prata">Prata</option>
        <option value="azul">Azul</option>
        <option value="vermelho">Vermelho</option>
    </select>

    <button onclick="gosta()">Será que ele gosta?</button>
    <div id="imagem_exibir"></div>
</body>
<script>
    function gosta(){
        let tamanho =  Number(ipt_tmn.value);
        let cor = cores.value;
        if (tamanho > 6.5 && cor == "preto" || tamanho > 6.5 && cor== "prata"){
            imagem_exibir.innerHTML = `<img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRy-dToiF53UokCgozMcmbohwECMDM7oKgK4kbfx7UbDw&s=10">`
        } else {
            imagem_exibir.innerHTML = `<img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAPakN1hSeaS2tCV7EdflLXnFzZXsYwXMWm9EQKT3sN-cxEI7ZMFPTF58D&s=10">`
        }
    }

</script>
</html>
